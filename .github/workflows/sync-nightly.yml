name: Sincronizar ventas con Supabase

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar la publicación aunque no haya cambios"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: read

concurrency:
  group: sync-ventas-supabase
  cancel-in-progress: false

jobs:
  sync:
    name: Validar y sincronizar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VENTAS_DRIVE_ID: ${{ secrets.VENTAS_DRIVE_ID }}
      VENTAS_DRIVE_HOJA: Pedidos
      VENTAS_DRIVE_TIMEOUT: "120"
      VENTAS_DRIVE_RETRIES: "3"
      VENTAS_DRIVE_RETRY_WAIT: "5"
      TZ: Europe/Madrid

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest -q

      - name: Sincronizar con Supabase
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            python -m pipeline.sync_supabase --force --origen github_actions
          else
            python -m pipeline.sync_supabase --origen github_actions
          fi
