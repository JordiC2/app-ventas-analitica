services:
  dashboard:
    build: .
    image: app-ventas-dashboard
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VENTAS_DATA_DIR: /app/data
      TZ: Europe/Madrid
    volumes:
      # Persistencia local mientras la app todavía trabaja con Parquet.
      - ./data:/app/data
    command: >-
      /bin/sh -c "
      python -m pipeline.ingesta &&
      pytest -q &&
      exec uvicorn api.main:app --host 0.0.0.0 --port 8000
      "
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/estado', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
